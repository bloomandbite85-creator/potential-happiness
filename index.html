<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bloom and Bite Order Form</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--acc:#e91e8c;--txt:#2d0a1e;--lbl:#ad5080;--r:12px;}
body{font-family:'Sora', sans-serif;background:linear-gradient(145deg,#fff0f5,#fce4ec);background-attachment:fixed;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;color:var(--txt);}
.wa-card{background:#ffffff;border-radius:12px;box-shadow:0 4px 30px rgba(0,0,0,0.4);width:100%;max-width:480px;padding:36px 32px;}
.wa-head{margin-bottom:28px;}
.wa-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(37,211,102,0.1);border:1px solid rgba(37,211,102,0.2);border-radius:50px;padding:4px 12px;font-size:.75rem;color:#e91e8c;margin-bottom:14px;font-weight:600;}
.wa-head h1{font-size:1.6rem;font-weight:700;color:var(--txt);line-height:1.2;margin-bottom:8px;}
.wa-head p{color:var(--lbl);font-size:.9rem;line-height:1.5;}
.wa-field{margin-bottom:18px;}
.wa-field label{display:block;font-size:.8rem;font-weight:600;color:var(--lbl);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.wa-field label span{color:#ff6b6b;margin-left:2px;}
.wa-field input,.wa-field textarea,.wa-field select{width:100%;background:color-mix(in srgb, var(--txt) 6%, transparent);border:1px solid color-mix(in srgb, var(--txt) 20%, transparent);border-radius:var(--r);padding:10px 13px;color:var(--txt);font-family:'Sora', sans-serif;font-size:.9rem;transition:.2s;outline:none;}
.wa-field input:focus,.wa-field textarea:focus,.wa-field select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(37,211,102,0.15);}
.wa-group-label{display:block;font-size:.8rem;font-weight:600;color:var(--lbl);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
.wa-option{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid color-mix(in srgb, var(--txt) 18%, transparent);border-radius:calc(var(--r) - 2px);margin-bottom:6px;cursor:pointer;transition:.2s;font-size:.9rem;color:var(--txt);}
.wa-option:hover{border-color:var(--acc);background:rgba(37,211,102,0.05);}
.wa-option input{width:auto;flex-shrink:0;}
.wa-divider{text-align:center;position:relative;margin:22px 0 18px;}
.wa-divider::before{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:color-mix(in srgb, var(--txt) 18%, transparent);}
.wa-divider span{position:relative;background:#ffffff;padding:0 12px;font-size:.8rem;color:var(--lbl);font-weight:600;text-transform:uppercase;letter-spacing:.08em;}
.wa-submit{width:100%;padding:14px;background:var(--acc);border:none;border-radius:var(--r);color:#fff;font-family:'Sora', sans-serif;font-size:1rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px;transition:.2s;letter-spacing:.01em;}
.wa-submit:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 4px 20px rgba(37,211,102,0.35);}
.wa-submit:active{transform:translateY(0);}
.wa-err{color:#ff6b6b;font-size:.78rem;margin-top:4px;display:none;}
@media(max-width:520px){.wa-card{padding:24px 18px;}.wa-head h1{font-size:1.35rem;}}
</style>
</head>
<body>
<div class="wa-card">
<div class="wa-head">
<div class="wa-badge">
<svg width="18" height="18" viewBox="0 0 24 24" fill="#e91e8c"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347"/></svg>
WhatsApp Form
</div>
<h1>Bloom and Bite Order Form</h1>
<p>Please fill up the form and I will get to you via WhatsApp</p>
</div>

<form id="waForm" novalidate>
<div class="wa-divider"><span>Personal Details</span></div>
<div class="wa-field">
  <label for="fieldName">Your Name<span>*</span></label>
  <input type="text" id="fieldName" name="Your Name" placeholder="e.g. John Doe" required>
</div>
<div class="wa-field">
  <label for="fieldPhone">Phone Number<span>*</span></label>
  <input type="tel" id="fieldPhone" name="Phone Number" placeholder="+60 11-555 1234" required>
</div>
<div class="wa-field">
  <label for="fieldEmail">Email</label>
  <input type="email" id="fieldEmail" name="Email" placeholder="you@example.com">
</div>

<div class="wa-divider"><span>Order Details</span></div>
<div class="wa-field">
  <label for="fieldDate">Which delivery date do you prefer?<span>*</span></label>
  <select id="fieldDate" name="Delivery Date" required>
    <option value="">Choose…</option>
    <option>14/11/2026</option>
    <option>15/11/2026</option>
    <option>21/11/2026</option>
    <option>22/11/2026</option>
    <option>28/11/2026</option>
    <option>29/11/2026</option>
  </select>
</div>
<div class="wa-field">
  <label for="fieldTime">What time would you like us to deliver?<span>*</span></label>
  <input type="time" id="fieldTime" name="Delivery Time" required>
</div>

<div class="wa-field">
  <label class="wa-group-label">Desserts are you interested in?</label>
  <label class="wa-option"><input type="checkbox" name="desserts" value="Pavlova aux Fruits Rouges"><span>Pavlova aux Fruits Rouges</span></label>
  <label class="wa-option"><input type="checkbox" name="desserts" value="Tartelette Chocolat &amp; Pistache"><span>Tartelette Chocolat &amp; Pistache</span></label>
  <label class="wa-option"><input type="checkbox" name="desserts" value="Fruit Tarts"><span>Fruit Tarts</span></label>
  <label class="wa-option"><input type="checkbox" name="desserts" value="Mini Cheesecakes aux Fruits Frais"><span>Mini Cheesecakes aux Fruits Frais</span></label>
  <label class="wa-option"><input type="checkbox" name="desserts" value="Mini Gâteau au Chocolat"><span>Mini Gâteau au Chocolat</span></label>
  <label class="wa-option"><input type="checkbox" name="desserts" value="Classic Tiramisu"><span>Classic Tiramisu</span></label>
  <label class="wa-option"><input type="checkbox" name="desserts" value="Cupcakes FlorauxArtisanaux (Size S)"><span>Cupcakes FlorauxArtisanaux (Size S)</span></label>
  <label class="wa-option"><input type="checkbox" name="desserts" value="Choux au Craquelin (Size S)"><span>Choux au Craquelin (Size S)</span></label>
  <label class="wa-option"><input type="checkbox" name="desserts" value="French Macarons"><span>French Macarons</span></label>
</div>

<div id="formErr" class="wa-err"></div>

<button type="submit" class="wa-submit">
<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347"/></svg>
Send on WhatsApp
</button>
</form>
</div>

<script>
document.getElementById('waForm').addEventListener('submit', function(e) {
    e.preventDefault();

    var name = document.getElementById('fieldName').value.trim();
    var phoneInput = document.getElementById('fieldPhone').value.trim();
    var date = document.getElementById('fieldDate').value;
    var time = document.getElementById('fieldTime').value;
    var errDiv = document.getElementById('formErr');

    if (!name || !phoneInput || !date || !time) {
        errDiv.textContent = 'Please fill in all required fields.';
        errDiv.style.display = 'block';
        return;
    }
    errDiv.style.display = 'none';

    // Build the message text
    var message = "*New Order - Bloom & Bite*\n\n";
    message += "*Name:* " + name + "\n";
    message += "*Phone:* " + phoneInput + "\n";
    
    var email = document.getElementById('fieldEmail').value.trim();
    if (email) message += "*Email:* " + email + "\n";

    message += "*Delivery Date:* " + date + "\n";
    message += "*Delivery Time:* " + time + "\n";

    // Collect checked multiple choice checkboxes safely
    var checkedDesserts = document.querySelectorAll('input[name="desserts"]:checked');
    if (checkedDesserts.length > 0) {
        message += "\n*Desserts Interested In:*\n";
        checkedDesserts.forEach(function(cb) {
            message += "• " + cb.value + "\n";
        });
    }

    // Your WhatsApp destination number (from your script snippet)
    var targetPhone = "60194757500"; 
    var encodedMessage = encodeURIComponent(message);
    var whatsappURL = "https://wa.me/" + targetPhone + "?text=" + encodedMessage;

    window.open(whatsappURL, '_blank');
});
</script>
</body>
</html>
